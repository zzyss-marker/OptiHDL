version: '3.8'

services:
  optihdl-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optihdl-web
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - CUDA_VISIBLE_DEVICES=0
      # API mode (set these to skip local model loading)
      # - OPTIHDL_LLM_MODE=api
      # - OPTIHDL_API_BASE_URL=http://host.docker.internal:8000/v1
      # - OPTIHDL_API_KEY=your-key
      # - OPTIHDL_API_MODEL=qwen2.5-coder
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
