version: '3.8'

services:
  optihdl-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optihdl-web
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Mount source code so changes take effect without rebuild
      - ./web_app:/app/web_app
      - ./core_tools:/app/core_tools
      - ./optimization:/app/optimization
      - ./tools:/app/tools
      - ./run_optihdl.py:/app/run_optihdl.py
      # Data directories
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    # gunicorn --reload watches mounted files, restarts on change
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "300", "--reload", "web_app.app:create_app()"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
