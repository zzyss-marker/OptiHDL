<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ label }} — OptiHDL Circuit Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e1a;
            color: #cbd5e1;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background: rgba(18, 24, 40, 0.95);
            border-bottom: 1px solid rgba(72, 88, 118, 0.35);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .toolbar h1 {
            font-size: 18px;
            color: #38bdf8;
        }
        .toolbar .label {
            font-size: 14px;
            color: rgba(203, 213, 225, 0.75);
        }
        .toolbar a {
            margin-left: auto;
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
        }
        .toolbar a:hover { text-decoration: underline; }
        #circuit-container {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }
        #loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: rgba(148, 163, 184, 0.6);
            font-size: 16px;
        }
        .hint {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.5);
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <h1>OptiHDL</h1>
    <span class="label">{{ label }}</span>
    <a href="/">← 返回主页</a>
</div>
<div id="circuit-container">
    <div id="loading">加载电路图中...</div>
</div>
<div class="hint">拨动输入信号可实时查看输出变化 | 滚轮缩放 | 拖拽平移</div>

<script src="https://cdn.jsdelivr.net/npm/digitaljs/dist/main.js"></script>
<script>
(async function() {
    const cid = "{{ circuit_id }}";
    const container = document.getElementById("circuit-container");
    const loading = document.getElementById("loading");

    try {
        const resp = await fetch(`/api/circuit_data/${cid}`);
        const data = await resp.json();
        if (!data.success) {
            loading.textContent = "加载失败: " + (data.error || "未知错误");
            return;
        }
        loading.remove();

        if (typeof digitaljs === "undefined") {
            container.textContent = "DigitalJS library not loaded";
            return;
        }

        const circuit = new digitaljs.Circuit(data.circuit);
        circuit.displayOn($(container));
        circuit.start();
    } catch (e) {
        loading.textContent = "加载失败: " + e.message;
    }
})();
</script>
</body>
</html>
